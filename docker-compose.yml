version: '3.8'

services:
  # --- FRONTEND (Vue.js) ---
  client:
    build: ./client
    ports:
      - "5173:5173" # Espone Vue sul tuo browser
    volumes:
      - ./client:/app
      - /app/node_modules # Protegge le dipendenze interne
    environment:
      - VITE_API_URL=http://localhost:4000 # Indirizzo che il BROWSER userà per le API
    command: npm run dev -- --host 0.0.0.0 # Fondamentale per rendere Vue accessibile

  # --- BACKEND (Il tuo Server) ---
  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
    environment:
      - MONGO_URL=mongodb://database:27017/quidsi # Se usi un DB
    depends_on:
      - database # Solo se hai anche il modulo DB

  # --- DATABASE (Opzionale) ---
  database:
    image: mongo:latest
    ports:
      - "27017:27017"
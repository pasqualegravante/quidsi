version: '3.8'

services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    command: npm run dev -- --host 0.0.0.0

  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - MONGODB_URI=mongodb://database:27017/quidsi
      # 🔥 AGGIUNTE VARIABILI MANCANTI PER JWT E PROXY
      - JWT_SECRET=segreto_super_sicuro_123
      - COOKIE_TTL=3600000
      - PYTHON_URL=http://engine:8000
    depends_on:
      - database
      - engine

  engine:
    build: ./server/pybackend
    ports:
      - "8000:8000"
    volumes:
      - ./server/pybackend:/app

  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: